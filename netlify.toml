# Pretty URLs — serve /blog/<slug> from /blog/<slug>.html.
# NOTE: this rule must come BEFORE the exact /blog rule below; Netlify
# applies the first matching rule. "/blog/*" requires a segment after
# "/blog/", so "/blog" alone still matches the exact rule beneath.
# The trailing-slash 301 must come FIRST of all: without it, /blog/<slug>/
# rewrites to /blog/<slug>/.html and 404s.
[[redirects]]
  from = "/blog/:splat/"
  to = "/blog/:splat"
  status = 301

# Markdown alternates serve directly; they must not hit the /*.html rewrite.
[[redirects]]
  from = "/blog/:slug.md"
  to = "/blog/:slug.md"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200
