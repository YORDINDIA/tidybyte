# Netlify configuration for the TidyByte marketing site (Astro build).
# The site lives in website/ of the monorepo. `base` makes Netlify install,
# build, and publish from there, so `publish` below is website/dist.
# Build: astro build renders dist/ from src/; Tailwind CLI compiles
# src/input.css → dist/assets/css/styles.css; hash-assets.mjs fingerprints
# CSS/JS and rewrites references. Publish: dist/.

[build]
  base = "website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >= 22.12 (build-time only; the site is static).
  NODE_VERSION = "22"

# Shared security and cache headers live in website/public/_headers.
# Shared legacy redirects live in website/public/_redirects.

# Custom 404.
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

# Pretty URLs — serve /support from /support.html etc.
[[redirects]]
  from = "/mac"
  to = "/mac.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/changelog"
  to = "/changelog.html"
  status = 200

# Tool landing pages — one page per cleanup job, served from <slug>.html.
# Trailing slashes are 301'd away first so /<slug>/ never resolves to
# /<slug>/.html (same ordering rule as the blog routes below).
[[redirects]]
  from = "/:slug/"
  to = "/:slug"
  status = 301

